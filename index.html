<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>MeShape Gift Shop — Personalized & Premium Gifts</title>
    <meta
      name="description"
      content="MeShape Gift Shop — personalized mugs, lamps, keychains, cushions and gift hampers. Order online for pickup or delivery across India."
    />
    <meta name="theme-color" content="#3A1030" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="/" />

    <!--
      Open Graph readiness. Phase 10 QA fix: this previously pointed at
      /og-image.jpg, which was never created — a dangling reference since
      Phase 1 that would have shown a broken image in every WhatsApp/
      social link preview. /og-image.svg is a real, branded placeholder
      that closes that gap, but SVG og:image support is inconsistent
      across platforms (older WhatsApp/Facebook crawlers in particular
      often don't render it) — replacing this with a real 1200x630
      JPG/PNG photo before serious social sharing use is recommended; see
      PROJECT_REQUIREMENTS.md for this noted as a pre-launch item.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeShape Gift Shop" />
    <meta property="og:title" content="MeShape Gift Shop — Personalized & Premium Gifts" />
    <meta
      property="og:description"
      content="Personalized mugs, lamps, keychains, cushions and gift hampers. Order online for pickup or delivery across India."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Fonts: Fraunces (display serif) + Manrope (body sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
